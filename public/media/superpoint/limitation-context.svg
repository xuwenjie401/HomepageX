<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">利用周围结构辅助消除局部匹配歧义</title><desc id="desc">局部图块相似的两个候选，在考虑邻域关系后得到不同支持。表示上下文作用，不表示SuperGlue的具体层结构或硬距离约束。</desc><defs><marker id="657282" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#657282"/></marker><marker id="306ba3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#306ba3"/></marker><marker id="c37a30" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c37a30"/></marker><marker id="288379" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#288379"/></marker></defs><rect width="1200" height="690" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="36" y="47" font-size="30" fill="#202a35" font-weight="650" text-anchor="start">局部外观相似时，让周围的点也参与判断</text><text x="36" y="84" font-size="21" fill="#657282" font-weight="400" text-anchor="start">邻域关系与跨图信息可以帮助重新评估候选，而不是只比较两个孤立向量。</text><path d="M36,107 L1164,107" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="47" y="152" font-size="24" fill="#202a35" font-weight="650" text-anchor="start">(a) 只看局部</text><text x="48" y="187" font-size="20" fill="#657282" font-weight="400" text-anchor="start">两个候选的图块很像</text><rect x="345" y="140" width="80" height="75" fill="#e6edf4" stroke="#d8dfe6" /><path d="M355,191 L412,159" fill="none" stroke="#306ba3" stroke-width="2"/><circle cx="385" cy="177" r="7" fill="#306ba3"/><text x="385" y="248" font-size="21" fill="#657282" font-weight="400" text-anchor="middle">查询点</text><rect x="744" y="140" width="80" height="75" fill="#e6edf4" stroke="#d8dfe6" /><path d="M754,191 L811,159" fill="none" stroke="#306ba3" stroke-width="2"/><circle cx="784" cy="177" r="7" fill="#306ba3"/><text x="784" y="248" font-size="21" fill="#657282" font-weight="400" text-anchor="middle">候选 1</text><rect x="1040" y="140" width="80" height="75" fill="#e6edf4" stroke="#d8dfe6" /><path d="M1050,191 L1107,159" fill="none" stroke="#306ba3" stroke-width="2"/><circle cx="1080" cy="177" r="7" fill="#306ba3"/><text x="1080" y="248" font-size="21" fill="#657282" font-weight="400" text-anchor="middle">候选 2</text><path d="M432,175 L733,175" fill="none" stroke="#c37a30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#c37a30)"/><path d="M432,205 L1030,205" fill="none" stroke="#c37a30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#c37a30)"/><path d="M36,277 L1164,277" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="47" y="319" font-size="24" fill="#202a35" font-weight="650" text-anchor="start">(b) 加入上下文</text><text x="48" y="354" font-size="20" fill="#657282" font-weight="400" text-anchor="start">比较点与周围结构的关系</text><path d="M385,435 L335,370" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="335" cy="370" r="7" fill="#c37a30"/><path d="M385,435 L450,410" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="450" cy="410" r="7" fill="#657282"/><path d="M385,435 L415,497" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="415" cy="497" r="7" fill="#657282"/><circle cx="385" cy="435" r="9" fill="#306ba3"/><circle cx="385" cy="435" r="16" fill="none" stroke="#306ba3" stroke-width="2.5"/><path d="M784,435 L734,370" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="734" cy="370" r="7" fill="#c37a30"/><path d="M784,435 L849,410" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="849" cy="410" r="7" fill="#657282"/><path d="M784,435 L814,497" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="814" cy="497" r="7" fill="#657282"/><circle cx="784" cy="435" r="9" fill="#306ba3"/><circle cx="784" cy="435" r="16" fill="none" stroke="#288379" stroke-width="2.5"/><path d="M1080,435 L1016,447" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="1016" cy="447" r="7" fill="#c37a30"/><path d="M1080,435 L1095,363" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="1095" cy="363" r="7" fill="#657282"/><path d="M1080,435 L1158,495" fill="none" stroke="#aebcca" stroke-width="2"/><circle cx="1158" cy="495" r="7" fill="#657282"/><circle cx="1080" cy="435" r="9" fill="#306ba3"/><circle cx="1080" cy="435" r="16" fill="none" stroke="#306ba3" stroke-width="2.5"/><path d="M409,432 L759,432" fill="none" stroke="#288379" stroke-width="2" marker-end="url(#288379)"/><path d="M409,465 L1056,465" fill="none" stroke="#c37a30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#c37a30)"/><text x="587" y="413" font-size="20" fill="#288379" font-weight="400" text-anchor="middle">上下文提供支持</text><text x="933" y="508" font-size="19" fill="#c37a30" font-weight="400" text-anchor="middle">周围关系不同</text><text x="784" y="550" font-size="20" fill="#288379" font-weight="400" text-anchor="middle">重新评估候选 1</text><text x="1080" y="550" font-size="20" fill="#c37a30" font-weight="400" text-anchor="middle">候选 2 可被降权</text><path d="M36,586 L1164,586" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="36" y="626" font-size="23" fill="#288379" font-weight="650" text-anchor="start">改进方向：图内聚合 + 跨图交互 + 匹配分配 / 拒绝匹配</text><text x="36" y="663" font-size="19" fill="#657282" font-weight="400" text-anchor="start">关系示意，不是 SuperGlue 的网络结构图，也不是要求邻居距离保持不变的硬规则。</text></g></svg>