<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="705" viewBox="0 0 1000 705" role="img" aria-labelledby="title desc">
<title id="title">为什么热力图必须先对齐再聚合</title><desc id="desc">同一几何角点经过平移、旋转后位置不同；逆变换后稳定响应对齐，偶发响应减弱。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#376d5b"/></marker></defs>
<rect width="1000" height="705" rx="18" fill="#f0f1e9"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="38" y="48" font-size="28" fill="#292b27" font-weight="650" text-anchor="start">聚合之前，先让同一个点回到同一个位置</text><text x="38" y="83" font-size="20" fill="#666c63" font-weight="400" text-anchor="start">三次预测的教学示意；圆点代表检测响应，非模型实测。</text><rect x="38" y="110" width="280" height="225" rx="14" fill="#fff" stroke="#d9ddd3"/><text x="58" y="143" font-size="22" fill="#292b27" font-weight="600" text-anchor="start">原图坐标</text><g transform="translate(178,245)"><g transform=""><path d="M-72,46 L-72,-45 L55,-45 L55,46" fill="none" stroke="#9ba69c" stroke-width="5"/><circle cx="-72" cy="-45" r="8" fill="#376d5b"/><circle cx="55" cy="-45" r="8" fill="#376d5b"/></g></g><path d="M178,350 L178,407" stroke="#376d5b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="193" y="385" font-size="19" fill="#376d5b" font-weight="400" text-anchor="start">恒等映射</text><rect x="38" y="425" width="280" height="155" rx="14" fill="#fff" stroke="#d9ddd3"/><path d="M106,548 L106,467 L233,467 L233,548" fill="none" stroke="#9ba69c" stroke-width="4"/><circle cx="106" cy="467" r="8" fill="#376d5b"/><circle cx="233" cy="467" r="8" fill="#376d5b"/><rect x="360" y="110" width="280" height="225" rx="14" fill="#fff" stroke="#d9ddd3"/><text x="380" y="143" font-size="22" fill="#292b27" font-weight="600" text-anchor="start">平移后的坐标</text><g transform="translate(500,245)"><g transform="translate(28,-20)"><path d="M-72,46 L-72,-45 L55,-45 L55,46" fill="none" stroke="#9ba69c" stroke-width="5"/><circle cx="-72" cy="-45" r="8" fill="#376d5b"/><circle cx="55" cy="-45" r="8" fill="#376d5b"/><circle cx="-12" cy="20" r="7" fill="#a84d30"/></g></g><path d="M500,350 L500,407" stroke="#376d5b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="515" y="385" font-size="19" fill="#376d5b" font-weight="400" text-anchor="start">逆平移</text><rect x="360" y="425" width="280" height="155" rx="14" fill="#fff" stroke="#d9ddd3"/><path d="M428,548 L428,467 L555,467 L555,548" fill="none" stroke="#9ba69c" stroke-width="4"/><circle cx="428" cy="467" r="8" fill="#376d5b"/><circle cx="555" cy="467" r="8" fill="#376d5b"/><circle cx="488" cy="532" r="7" fill="#a84d30"/><rect x="682" y="110" width="280" height="225" rx="14" fill="#fff" stroke="#d9ddd3"/><text x="702" y="143" font-size="22" fill="#292b27" font-weight="600" text-anchor="start">旋转后的坐标</text><g transform="translate(822,245)"><g transform="rotate(22)"><path d="M-72,46 L-72,-45 L55,-45 L55,46" fill="none" stroke="#9ba69c" stroke-width="5"/><circle cx="-72" cy="-45" r="8" fill="#376d5b"/><circle cx="55" cy="-45" r="8" fill="#376d5b"/></g></g><path d="M822,350 L822,407" stroke="#376d5b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="837" y="385" font-size="19" fill="#376d5b" font-weight="400" text-anchor="start">逆旋转</text><rect x="682" y="425" width="280" height="155" rx="14" fill="#fff" stroke="#d9ddd3"/><path d="M750,548 L750,467 L877,467 L877,548" fill="none" stroke="#9ba69c" stroke-width="4"/><circle cx="750" cy="467" r="8" fill="#376d5b"/><circle cx="877" cy="467" r="8" fill="#376d5b"/><text x="38" y="625" font-size="23" fill="#376d5b" font-weight="600" text-anchor="start">对齐后：稳定角点的响应重合，偶发响应只出现一次。</text><text x="38" y="665" font-size="21" fill="#666c63" font-weight="400" text-anchor="start">只在有效可见区域内求平均；越界区域不能当作“没有角点”。</text></g></svg>