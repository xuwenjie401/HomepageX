<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
<title id="title">SuperPoint 的训练与部署流程</title><desc id="desc">三个训练阶段：合成监督预训练、真实图像伪标注、联合训练；部署时一次前向输出点与描述子。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#376d5b"/></marker></defs>
<rect width="1000" height="720" rx="18" fill="#f0f1e9"/>
<g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif"><text x="38" y="48" font-size="29" fill="#292b27" font-weight="650" text-anchor="start">先造出监督，再把监督压进一个网络</text><text x="38" y="82" font-size="20" fill="#666c63" font-weight="400" text-anchor="start">训练时多看几次；部署时只需一次前向传播。</text><rect x="38" y="112" width="924" height="122" rx="14" fill="#fff" stroke="#d9ddd3"/><text x="65" y="160" font-size="28" fill="#376d5b" font-weight="700" text-anchor="start">01</text><text x="133" y="152" font-size="24" fill="#292b27" font-weight="600" text-anchor="start">合成几何图形</text><text x="133" y="190" font-size="20" fill="#666c63" font-weight="400" text-anchor="start">程序知道角点坐标</text><text x="600" y="178" font-size="20" fill="#376d5b" font-weight="600" text-anchor="start">监督训练 → MagicPoint</text><path d="M93,237 L93,259" stroke="#376d5b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="262" width="924" height="122" rx="14" fill="#fff" stroke="#d9ddd3"/><text x="65" y="310" font-size="28" fill="#a84d30" font-weight="700" text-anchor="start">02</text><text x="133" y="302" font-size="24" fill="#292b27" font-weight="600" text-anchor="start">没有标注的真实照片</text><text x="133" y="340" font-size="20" fill="#666c63" font-weight="400" text-anchor="start">变换 → 检测 → 对齐 → 聚合</text><text x="600" y="328" font-size="20" fill="#a84d30" font-weight="600" text-anchor="start">生成更稳定的伪标签</text><path d="M93,387 L93,409" stroke="#376d5b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="38" y="412" width="924" height="122" rx="14" fill="#fff" stroke="#d9ddd3"/><text x="65" y="460" font-size="28" fill="#376d5b" font-weight="700" text-anchor="start">03</text><text x="133" y="452" font-size="24" fill="#292b27" font-weight="600" text-anchor="start">真实图像与变换后的图像</text><text x="133" y="490" font-size="20" fill="#666c63" font-weight="400" text-anchor="start">伪标签教检测；单应关系教描述</text><text x="600" y="478" font-size="20" fill="#376d5b" font-weight="600" text-anchor="start">联合训练 → SuperPoint</text><rect x="38" y="583" width="924" height="108" rx="14" fill="#e1ebe4" stroke="#b6cebf"/><text x="65" y="624" font-size="23" fill="#376d5b" font-weight="650" text-anchor="start">部署</text><text x="160" y="624" font-size="24" fill="#376d5b" font-weight="600" text-anchor="start">图像 → 共享编码器 → 关键点 + 描述子</text><text x="160" y="660" font-size="20" fill="#666c63" font-weight="400" text-anchor="start">描述子匹配、RANSAC、位姿估计是后续步骤。</text></g></svg>