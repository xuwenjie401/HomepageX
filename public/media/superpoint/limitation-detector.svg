<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="title desc"><title id="title">稀疏检测瓶颈与粗到细匹配</title><desc id="desc">对比弱纹理区域未被检测器选入点集，与在粗网格上交互匹配再局部细化的路径。不声称完全空白或遮挡区域可以可靠匹配。</desc><defs><marker id="657282" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#657282"/></marker><marker id="306ba3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#306ba3"/></marker><marker id="c37a30" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c37a30"/></marker><marker id="288379" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#288379"/></marker></defs><rect width="1200" height="756" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="36" y="47" font-size="30" fill="#202a35" font-weight="650" text-anchor="start">候选点没被检测出来，后面的匹配器就无从选择</text><text x="36" y="84" font-size="21" fill="#657282" font-weight="400" text-anchor="start">从独立检测的稀疏点集，转向两图交互后的粗到细匹配。</text><path d="M36,107 L1164,107" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="43" y="151" font-size="24" fill="#202a35" font-weight="650" text-anchor="start">(a) 先检测，再匹配</text><rect x="47" y="177" width="287" height="157" fill="#f1f3f5" stroke="#d8dfe6" /><rect x="63" y="199" width="44" height="114" fill="#bdc9d3" stroke="none" /><path d="M63,313 L314,313" fill="none" stroke="#bac7d2" stroke-width="2"/><circle cx="63" cy="199" r="5" fill="#306ba3"/><circle cx="107" cy="199" r="5" fill="#306ba3"/><circle cx="107" cy="313" r="5" fill="#306ba3"/><rect x="160" y="219" width="91" height="68" fill="none" stroke="#c37a30" stroke-dasharray="6 5"/><rect x="479" y="177" width="287" height="157" fill="#f1f3f5" stroke="#d8dfe6" /><rect x="495" y="199" width="44" height="114" fill="#bdc9d3" stroke="none" /><path d="M495,313 L746,313" fill="none" stroke="#bac7d2" stroke-width="2"/><circle cx="495" cy="199" r="5" fill="#306ba3"/><circle cx="539" cy="199" r="5" fill="#306ba3"/><circle cx="539" cy="313" r="5" fill="#306ba3"/><rect x="592" y="219" width="91" height="68" fill="none" stroke="#c37a30" stroke-dasharray="6 5"/><path d="M340,254 L469,254" fill="none" stroke="#c37a30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#c37a30)"/><text x="407" y="225" font-size="18" fill="#c37a30" font-weight="400" text-anchor="middle">区域内缺点</text><text x="824" y="222" font-size="24" fill="#c37a30" font-weight="650" text-anchor="start">点集没有覆盖这里</text><text x="824" y="266" font-size="20" fill="#657282" font-weight="400" text-anchor="start">匹配器只能处理收到的候选</text><text x="824" y="304" font-size="20" fill="#657282" font-weight="400" text-anchor="start">提高匹配能力，也不等于补点</text><path d="M36,374 L1164,374" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="43" y="419" font-size="24" fill="#202a35" font-weight="650" text-anchor="start">(b) 特征交互，粗到细匹配</text><rect x="47" y="449" width="287" height="157" fill="#f1f3f5" stroke="#d8dfe6" /><rect x="63" y="471" width="44" height="114" fill="#bdc9d3" stroke="none" /><path d="M63,585 L314,585" fill="none" stroke="#bac7d2" stroke-width="2"/><path d="M82,449 L82,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M117,449 L117,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M152,449 L152,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M187,449 L187,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M222,449 L222,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M257,449 L257,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M292,449 L292,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M47,480 L334,480" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M47,511 L334,511" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M47,542 L334,542" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M47,573 L334,573" fill="none" stroke="#d2dce5" stroke-width="2"/><rect x="187" y="511" width="35" height="31" fill="#bee0d8" stroke="#288379" stroke-width="2.5"/><rect x="479" y="449" width="287" height="157" fill="#f1f3f5" stroke="#d8dfe6" /><rect x="495" y="471" width="44" height="114" fill="#bdc9d3" stroke="none" /><path d="M495,585 L746,585" fill="none" stroke="#bac7d2" stroke-width="2"/><path d="M514,449 L514,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M549,449 L549,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M584,449 L584,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M619,449 L619,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M654,449 L654,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M689,449 L689,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M724,449 L724,606" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M479,480 L766,480" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M479,511 L766,511" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M479,542 L766,542" fill="none" stroke="#d2dce5" stroke-width="2"/><path d="M479,573 L766,573" fill="none" stroke="#d2dce5" stroke-width="2"/><rect x="619" y="511" width="35" height="31" fill="#bee0d8" stroke="#288379" stroke-width="2.5"/><path d="M221,526 L619,526" fill="none" stroke="#288379" stroke-width="2" marker-end="url(#288379)"/><text x="407" y="483" font-size="19" fill="#288379" font-weight="400" text-anchor="middle">粗网格候选</text><path d="M779,526 L825,526" fill="none" stroke="#288379" stroke-width="2" marker-end="url(#288379)"/><rect x="849" y="463" width="114" height="114" fill="#f4f8fa" stroke="#d8dfe6" /><rect x="875" y="489" width="61" height="61" fill="none" stroke="#a5b6c6" /><circle cx="905" cy="519" r="5" fill="#306ba3"/><circle cx="912" cy="513" r="4" fill="#288379"/><path d="M905,519 L912,513" fill="none" stroke="#288379" stroke-width="2" marker-end="url(#288379)"/><text x="988" y="505" font-size="23" fill="#288379" font-weight="650" text-anchor="start">局部细化</text><text x="988" y="546" font-size="19" fill="#657282" font-weight="400" text-anchor="start">得到更精细坐标</text><path d="M36,652 L1164,652" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="36" y="692" font-size="23" fill="#288379" font-weight="650" text-anchor="start">改进方向：解除对独立稀疏检测点的依赖，而不是承诺处处都能匹配</text><text x="36" y="729" font-size="19" fill="#657282" font-weight="400" text-anchor="start">受 LoFTR 思路启发的机制示意；弱纹理仍需上下文信息，完全无信息或不可见区域仍可能无法匹配。</text></g></svg>