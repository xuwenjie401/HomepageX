<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="715" viewBox="0 0 1200 715" role="img" aria-labelledby="title desc"><title id="title">不同深度造成单应对齐后的视差残差</title><desc id="desc">墙面和前景立柱随相机平移产生不同位移。以墙面估计的单应关系无法同时消除前景视差，也无法从原图恢复新显露区域。</desc><defs><marker id="657282" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#657282"/></marker><marker id="306ba3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#306ba3"/></marker><marker id="c37a30" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c37a30"/></marker><marker id="288379" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#288379"/></marker></defs><rect width="1200" height="715" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><g color="#202a35" aria-label="一张 $H$ 能对齐墙面，却未必能对齐前景"><text  y="47" font-size="30" fill="#202a35" font-weight="650" x="36" text-anchor="start" xml:space="preserve">一张 </text><svg x="104.4" y="27.29" width="24.150000000000002" height="19.71" viewBox="0 -657 805 657"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math" data-latex="H"><g data-mml-node="mi" data-latex="H"><path data-c="1D43B" d="M275 525C293 603 296 627 388 627L393 657L118 657L112 627C199 627 203 605 186 525L104 131C86 42 72 30-7 30L-13 0L261 0L267 30C185 30 176 43 195 131L233 318L556 318L517 131C499 44 493 30 415 30L410 0L674 0L680 30C595 30 590 45 608 131L689 525C706 604 710 627 799 627L805 657L537 657L531 627C620 627 616 603 599 525L564 357L240 357Z"></path></g></g></g></svg><text  y="47" font-size="30" fill="#202a35" font-weight="650" x="128.55" text-anchor="start" xml:space="preserve"> 能对齐墙面，却未必能对齐前景</text></g><text x="36" y="84" font-size="21" fill="#657282" font-weight="400" text-anchor="start">深度不同 → 视差不同；重新显露的背景也无法从原图凭空恢复。</