<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="703" viewBox="0 0 1200 703" role="img" aria-labelledby="title desc"><title id="title">重复性不等于描述子可靠性</title><desc id="desc">图像A中的一个稳定窗角，对应图像B中的多个相似局部候选。区分检测的重复性与描述子的可辨识度。</desc><defs><marker id="657282" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#657282"/></marker><marker id="306ba3" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#306ba3"/></marker><marker id="c37a30" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#c37a30"/></marker><marker id="288379" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#288379"/></marker></defs><rect width="1200" height="703" fill="white"/><g font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif"><text x="36" y="47" font-size="30" fill="#202a35" font-weight="650" text-anchor="start">能反复检测出来，不等于能唯一匹配</text><text x="36" y="84" font-size="21" fill="#657282" font-weight="400" text-anchor="start">重复窗格的角点很稳定，但它们的局部外观可能几乎相同。</text><path d="M36,107 L1164,107" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="229" y="151" font-size="24" fill="#202a35" font-weight="650" text-anchor="middle">图像 A：选中一个窗角</text><text x="969" y="151" font-size="24" fill="#202a35" font-weight="650" text-anchor="middle">图像 B：多个相似候选</text><rect x="59" y="182" width="340" height="220" fill="#edf1f5" stroke="#d8dfe6" /><rect x="87" y="208" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M122,208 L122,278" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M87,243 L157,243" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="87" cy="208" r="4" fill="#306ba3"/><rect x="191" y="208" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M226,208 L226,278" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M191,243 L261,243" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="191" cy="208" r="4" fill="#306ba3"/><rect x="295" y="208" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M330,208 L330,278" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M295,243 L365,243" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="295" cy="208" r="4" fill="#306ba3"/><rect x="87" y="311" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M122,311 L122,381" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M87,346 L157,346" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="87" cy="311" r="4" fill="#306ba3"/><rect x="191" y="311" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M226,311 L226,381" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M191,346 L261,346" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="191" cy="311" r="4" fill="#306ba3"/><rect x="295" y="311" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M330,311 L330,381" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M295,346 L365,346" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="295" cy="311" r="4" fill="#306ba3"/><rect x="799" y="182" width="340" height="220" fill="#edf1f5" stroke="#d8dfe6" /><rect x="827" y="208" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M862,208 L862,278" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M827,243 L897,243" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="827" cy="208" r="4" fill="#306ba3"/><rect x="931" y="208" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M966,208 L966,278" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M931,243 L1001,243" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="931" cy="208" r="4" fill="#306ba3"/><rect x="1035" y="208" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M1070,208 L1070,278" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M1035,243 L1105,243" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="1035" cy="208" r="4" fill="#306ba3"/><rect x="827" y="311" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M862,311 L862,381" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M827,346 L897,346" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="827" cy="311" r="4" fill="#306ba3"/><rect x="931" y="311" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M966,311 L966,381" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M931,346 L1001,346" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="931" cy="311" r="4" fill="#306ba3"/><rect x="1035" y="311" width="70" height="70" fill="#acbfd0" stroke="#738ca4" /><path d="M1070,311 L1070,381" fill="none" stroke="#edf1f5" stroke-width="2"/><path d="M1035,346 L1105,346" fill="none" stroke="#edf1f5" stroke-width="2"/><circle cx="1035" cy="311" r="4" fill="#306ba3"/><circle cx="191" cy="208" r="12" fill="none" stroke="#288379" stroke-width="2.5"/><path d="M205,208 L813,208" fill="none" stroke="#c37a30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#c37a30)"/><circle cx="827" cy="208" r="12" fill="none" stroke="#c37a30" stroke-width="2.5"/><path d="M205,208 L917,311" fill="none" stroke="#c37a30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#c37a30)"/><circle cx="931" cy="311" r="12" fill="none" stroke="#c37a30" stroke-width="2.5"/><path d="M205,208 L1021,311" fill="none" stroke="#c37a30" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#c37a30)"/><circle cx="1035" cy="311" r="12" fill="none" stroke="#c37a30" stroke-width="2.5"/><rect x="456" y="283" width="282" height="91" fill="#fff" stroke="#d8dfe6" /><text x="597" y="319" font-size="21" fill="#202a35" font-weight="650" text-anchor="middle">三个图块都像这个窗角</text><text x="597" y="351" font-size="20" fill="#657282" font-weight="400" text-anchor="middle">局部描述难以拉开差距</text><rect x="59" y="443" width="504" height="118" fill="#f2f8f6" stroke="#d8dfe6" /><text x="83" y="482" font-size="23" fill="#288379" font-weight="650" text-anchor="start">重复性：同一物理点还能找到吗？</text><text x="83" y="524" font-size="21" fill="#657282" font-weight="400" text-anchor="start">回答的是检测在不同图像中的稳定性。</text><rect x="635" y="443" width="504" height="118" fill="#fbf7f0" stroke="#d8dfe6" /><text x="659" y="482" font-size="23" fill="#c37a30" font-weight="650" text-anchor="start">可靠性：这个点容易匹配对吗？</text><text x="659" y="524" font-size="21" fill="#657282" font-weight="400" text-anchor="start">稳定的周期纹理，也可能具有强歧义。</text><path d="M36,599 L1164,599" fill="none" stroke="#d8dfe6" stroke-width="2"/><text x="36" y="639" font-size="23" fill="#288379" font-weight="650" text-anchor="start">改进方向：除了重复性，还评估描述子的可辨识度</text><text x="36" y="676" font-size="19" fill="#657282" font-weight="400" text-anchor="start">人工构造的重复纹理与候选关系；不是模型输出。完全对称的纹理未必仅凭局部外观就可消歧。</text></g></svg>