<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="context-stroke"/></marker></defs><text x="35" y="38" font-size="25" fill="#213047" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">静态物体可以多帧融合；动态物体会被错误合成</text><text x="45" y="84" font-size="22" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">(a) 同一静态盒子</text><line x1="45" y1="352" x2="500" y2="352" stroke="#778396" stroke-width="2"/><text x="590" y="84" font-size="22" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">(b) 物体正在移动</text><line x1="590" y1="352" x2="1045" y2="352" stroke="#778396" stroke-width="2"/><rect x="180" y="160" width="155" height="110" rx="0" fill="none" stroke="#2563a6" stroke-width="2"/><path d="M87.00,322.00 L113.00,322.00 L113.00,348.00 L87.00,348.00 Z" fill="white" stroke="#2563a6" stroke-width="2"/><path d="M113.00,328.00 L129.00,319.00 L129.00,351.00 L113.00,342.00 Z" fill="white" stroke="#2563a6" stroke-width="2"/><line x1="125" y1="327" x2="255" y2="225" stroke="#778396" stroke-width="1" stroke-dasharray="7 5"/><rect x="185" y="167" width="155" height="110" rx="0" fill="none" stroke="#267a65" stroke-width="2"/><path d="M212.00,322.00 L238.00,322.00 L238.00,348.00 L212.00,348.00 Z" fill="white" stroke="#2563a6" stroke-width="2"/><path d="M238.00,328.00 L254.00,319.00 L254.00,351.00 L238.00,342.00 Z" fill="white" stroke="#2563a6" stroke-width="2"/><line x1="250" y1="327" x2="255" y2="225" stroke="#778396" stroke-width="1" stroke-dasharray="7 5"/><rect x="190" y="174" width="155" height="110" rx="0" fill="none" stroke="#b78c2c" stroke-width="2"/><path d="M337.00,322.00 L363.00,322.00 L363.00,348.00 L337.00,348.00 Z" fill="white" stroke="#2563a6" stroke-width="2"/><path d="M363.00,328.00 L379.00,319.00 L379.00,351.00 L363.00,342.00 Z" fill="white" stroke="#2563a6" stroke-width="2"/><line x1="375" y1="327" x2="255" y2="225" stroke="#778396" stroke-width="1" stroke-dasharray="7 5"/><rect x="186" y="168" width="155" height="110" rx="0" fill="none" stroke="#ce593e" stroke-width="2"/><text x="80" y="393" font-size="21" fill="#213047" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">统一世界坐标后，等价朝向先对齐</text><rect x="640" y="175" width="150" height="100" rx="0" fill="none" stroke="#2563a6" stroke-width="2"/><rect x="710" y="175" width="150" height="100" rx="0" fill="none" stroke="#267a65" stroke-width="2"/><rect x="780" y="175" width="150" height="100" rx="0" fill="none" stroke="#b78c2c" stroke-width="2"/><line x1="650" y1="308" x2="985" y2="308" stroke="#778396" stroke-width="2" marker-end="url(#arr)"/><text x="958" y="341" font-size="20" fill="#213047" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">时间</text><rect x="721.6666666666666" y="168" width="150" height="114" rx="0" fill="none" stroke="#ce593e" stroke-width="2"/><text x="620" y="393" font-size="20" fill="#213047" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">相连的重叠框 → 平均到并不存在的位置</text><line x1="35" y1="432" x2="1065" y2="432" stroke="#eef3f7" stroke-width="2"/><text x="35" y="470" font-size="22" fill="#213047" text-anchor="start" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif">跨帧融合依赖“同一个静态实体”；IoU 连通并不能替代运动建模。</text></svg>