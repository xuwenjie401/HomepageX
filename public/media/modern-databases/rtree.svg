<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">R-tree 的包围盒能安全排除，也会产生假阳性</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(a) L 形区域及其包围盒</text><text x="550" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(b) 兄弟包围盒可以重叠</text><rect x="65" y="130" width="310" height="260" rx="3" fill="none" stroke="#c45435" stroke-width="2"/><path d="M65.00,130.00 L155.00,130.00 L155.00,295.00 L375.00,295.00 L375.00,390.00 L65.00,390.00 Z" stroke="#2563a6" stroke-width="3" fill="#edf2f7"/><circle cx="260" cy="210" r="9" fill="#c45435" stroke="none" stroke-width="2"/><text x="278" y="208" font-size="22" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">查询点</text><text x="183" y="265" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">缺口不属于区域</text><rect x="570" y="145" width="238" height="197" rx="3" fill="none" stroke="#2563a6" stroke-width="2"/><rect x="710" y="235" width="230" height="159" rx="3" fill="none" stroke="#24745e" stroke-width="2"/><path d="M590.00,168.00 L720.00,186.00 L695.00,255.00" stroke="#2563a6" stroke-width="3" fill="none"/><path d="M749.00,274.00 L849.00,250.00 L918.00,358.00" stroke="#24745e" stroke-width="3" fill="none"/><circle cx="765" cy="292" r="18" fill="none" stroke="#c45435" stroke-width="2"/><text x="560" y="423" font-size="20" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">查询重叠区可能需要访问两棵子树</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">先取包围盒候选，再执行真实相交／包含谓词；盒子命中不等于几何命中。</text></svg>