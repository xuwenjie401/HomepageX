<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">一个对象，三个投影：版本号揭示谁还没有追上</text><text x="50" y="153" font-size="24" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">权威主库</text><rect x="245" y="130" width="600" height="45" rx="3" fill="#edf2f7" stroke="#2563a6" stroke-width="2"/><text x="890" y="161" font-size="26" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">v12</text><text x="50" y="253" font-size="24" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">向量投影</text><rect x="245" y="230" width="550" height="45" rx="3" fill="#edf2f7" stroke="#c45435" stroke-width="2"/><text x="890" y="261" font-size="26" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">v11</text><text x="50" y="353" font-size="24" fill="#24745e" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">图投影</text><rect x="245" y="330" width="600" height="45" rx="3" fill="#edf2f7" stroke="#24745e" stroke-width="2"/><text x="890" y="361" font-size="26" fill="#24745e" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">v12</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">返回对象编号还不够；检索表示、源内容与权限状态应按版本复核。</text></svg>