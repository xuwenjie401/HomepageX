<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">过去发生的事件，必须连接过去的位置</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(a) 事件发生时 14:05</text><text x="540" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(b) 当前位置 18:00</text><rect x="55" y="137" width="245" height="214" rx="3" fill="#edf2f7" stroke="#2563a6" stroke-width="2"/><text x="177" y="124" font-size="22" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">区域 R</text><rect x="555" y="137" width="245" height="214" rx="3" fill="#edf2f7" stroke="#2563a6" stroke-width="2"/><text x="677" y="124" font-size="22" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">区域 R</text><circle cx="175" cy="250" r="9" fill="#c45435" stroke="none" stroke-width="2"/><text x="199" y="255" font-size="23" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">物体 O</text><circle cx="907" cy="250" r="9" fill="#24745e" stroke="none" stroke-width="2"/><text x="828" y="307" font-size="23" fill="#24745e" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">物体 O</text><line x1="800" y1="250" x2="893" y2="250" stroke="#24745e" stroke-width="2" marker-end="url(#arr)"/><text x="55" y="408" font-size="23" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">E1 发生于区域内：应当命中</text><text x="555" y="408" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">用当前位置连接：会错误漏掉 E1</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">事件时间定位历史状态版本；区域边界会变化时，也必须选择对应历史版本。</text></svg>