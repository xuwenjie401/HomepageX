<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">分区拆开数据，复制保留相同数据的多份</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(a) 分区：不相交的对象子集</text><text x="540" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(b) 副本：相同对象集合</text><rect x="50" y="147" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="108.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">1</text><rect x="170" y="147" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="228.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">2</text><rect x="290" y="147" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="348.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">3</text><rect x="50" y="252" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="108.5" y="284" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">4</text><rect x="170" y="252" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="228.5" y="284" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">5</text><rect x="290" y="252" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="348.5" y="284" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">6</text><text x="55" y="354" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">分区 A 与 B 合起来才是完整数据</text><rect x="550" y="147" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="608.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">1 2</text><rect x="670" y="147" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="728.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">3 4</text><rect x="790" y="147" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="848.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">5 6</text><rect x="550" y="252" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="608.5" y="284" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">1 2</text><rect x="670" y="252" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="728.5" y="284" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">3 4</text><rect x="790" y="252" width="117" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="848.5" y="284" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">5 6</text><text x="555" y="354" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">每一副本持有相同逻辑数据</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">两种机制可以组合；分区负责分摊，复制负责冗余与其他读／恢复需求。</text></svg>