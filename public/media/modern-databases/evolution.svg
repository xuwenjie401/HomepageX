<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">扩展要对准观测到的负载，而不是凑齐数据库名称</text><rect x="40" y="112" width="293" height="41" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="50" y="140" font-size="19" fill="white" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">测到的瓶颈</text><rect x="335" y="112" width="288" height="41" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="345" y="140" font-size="19" fill="white" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">采取的变化</text><rect x="625" y="112" width="323" height="41" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="635" y="140" font-size="19" fill="white" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">随之增加的工作</text><rect x="40" y="155" width="293" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="50" y="183" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">短事务受向量挤压</text><rect x="335" y="155" width="288" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="345" y="183" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">隔离向量计算／投影</text><rect x="625" y="155" width="323" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="635" y="183" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">传播延迟、版本复核</text><rect x="40" y="198" width="293" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="50" y="226" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">可变路径查询占主导</text><rect x="335" y="198" width="288" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="345" y="226" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">增加图查询投影</text><rect x="625" y="198" width="323" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="635" y="226" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">边同步、路径语义</text><rect x="40" y="241" width="293" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="50" y="269" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">事件历史增长最快</text><rect x="335" y="241" width="288" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="345" y="269" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">时间分区与归档</text><rect x="625" y="241" width="323" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="635" y="269" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">迟到事件、恢复演练</text><rect x="40" y="284" width="293" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="50" y="312" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">当前负载都能满足</text><rect x="335" y="284" width="288" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="345" y="312" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">保持集中架构</text><rect x="625" y="284" width="323" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="635" y="312" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">持续监控和容量评估</text><text x="50" y="377" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">先做正确性基线，再测结果质量、端到端延迟、更新可见性与恢复时间</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">这里列的是演进决策与代价；没有把设计假设伪装成压测成绩。</text></svg>