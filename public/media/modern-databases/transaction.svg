l="white" stroke="none" stroke-width="2"/><text x="845" y="339" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">条件不再成立</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">更新影响 0 行时不能出租成功；关联租赁记录也应在同一事务中写入。</text></svg>