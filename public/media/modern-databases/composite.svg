<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">复合键 (category, price)：先类别，再价格</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(a) 有序索引条目</text><rect x="50" y="147" width="143" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="121.5" y="179" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">A:10</text><rect x="196" y="147" width="143" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="267.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">A:90</text><rect x="342" y="147" width="143" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="413.5" y="179" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">B:20</text><rect x="488" y="147" width="143" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="559.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">B:80</text><rect x="634" y="147" width="143" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="705.5" y="179" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">C:15</text><rect x="780" y="147" width="143" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="851.5" y="179" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">C:70</text><text x="40" y="258" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(b) price &lt; 30 分散在每个类别区间</text><rect x="50" y="286" width="143" height="47" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="122" y="318" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">一小段</text><rect x="342" y="286" width="143" height="47" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="414" y="318" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">一小段</text><rect x="634" y="286" width="143" height="47" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="706" y="318" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">一小段</text><text x="50" y="390" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">category = B 且 price &lt; 30：只定位 B 的低价段</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">多列索引只有一个字典序；每个维度并没有独立连续的排序。</text></svg>