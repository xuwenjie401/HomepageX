<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">点、折线、带洞多边形与三维几何不是同一种对象</text><text x="45" y="98" font-size="22" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">Point</text><text x="290" y="98" font-size="22" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">LineString</text><text x="535" y="98" font-size="22" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">Polygon</text><text x="780" y="98" font-size="22" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">3D geometry</text><circle cx="130" cy="224" r="9" fill="#2563a6" stroke="none" stroke-width="2"/><text x="130" y="293" font-size="22" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">一个位置</text><path d="M297.00,269.00 L339.00,167.00 L413.00,235.00 L473.00,150.00" stroke="#2563a6" stroke-width="3" fill="none"/><circle cx="297" cy="269" r="5" fill="#2563a6" stroke="none" stroke-width="2"/><circle cx="339" cy="167" r="5" fill="#2563a6" stroke="none" stroke-width="2"/><circle cx="413" cy="235" r="5" fill="#2563a6" stroke="none" stroke-width="2"/><circle cx="473" cy="150" r="5" fill="#2563a6" stroke="none" stroke-width="2"/><text x="380" y="326" font-size="22" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">顶点有次序</text><path d="M541.00,153.00 L713.00,164.00 L725.00,284.00 L566.00,310.00 Z" stroke="#2563a6" stroke-width="3" fill="#edf2f7"/><rect x="596" y="201" width="62" height="56" rx="3" fill="white" stroke="#2563a6" stroke-width="2"/><text x="626" y="237" font-size="20" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">洞</text><path d="M795.00,298.00 L895.00,298.00 L895.00,198.00 L795.00,198.00 Z" stroke="#2563a6" stroke-width="2" fill="none"/><path d="M837.00,270.00 L937.00,270.00 L937.00,170.00 L837.00,170.00 Z" stroke="#2563a6" stroke-width="2" fill="none"/><line x1="795" y1="298" x2="837.0" y2="270.0" stroke="#2563a6" stroke-width="2"/><line x1="895" y1="298" x2="937.0" y2="270.0" stroke="#2563a6" stroke-width="2"/><line x1="895" y1="198" x2="937.0" y2="170.0" stroke="#2563a6" stroke-width="2"/><line x1="795" y1="198" x2="837.0" y2="170.0" stroke="#2563a6" stroke-width="2"/><text x="858" y="349" font-size="19" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">曲面 ≠ 实体体积</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">存储 Z 坐标与执行完整三维几何运算，是两种不同的能力。</text></svg>