<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">附近 + 图片相似：先决定候选全集，再定义 top-k</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(a) 先全局检索的失败路线</text><rect x="45" y="122" width="79" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="84.5" y="154" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">1</text><rect x="127" y="122" width="79" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="166.5" y="154" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">2</text><rect x="209" y="122" width="79" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="248.5" y="154" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">3</text><rect x="291" y="122" width="79" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="330.5" y="154" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">4</text><rect x="373" y="122" width="79" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="412.5" y="154" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">5</text><text x="55" y="233" font-size="24" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">前 5 都在区域外</text><te