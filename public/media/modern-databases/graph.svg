<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">属性图：节点有身份，关系有类型、方向和自己的属性</text><line x1="175.0" y1="205.0" x2="450.0" y2="205.0" stroke="#788597" stroke-width="2" marker-end="url(#arr)"/><line x1="500.0" y1="205.0" x2="775.0" y2="205.0" stroke="#788597" stroke-width="2" marker-end="url(#arr)"/><circle cx="150" cy="205" r="23" fill="white" stroke="#2563a6" stroke-width="2"/><text x="150" y="212" font-size="20" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">A</text><circle cx="475" cy="205" r="23" fill="white" stroke="#2563a6" stroke-width="2"/><text x="475" y="212" font-size="20" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">B</text><circle cx="800" cy="205" r="23" fill="white" stroke="#2563a6" stroke-width="2"/><text x="800" y="212" font-size="20" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">C</text><text x="312" y="170" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">DEPENDS_ON</text><text x="637" y="170" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">DEPENDS_ON</text><text x="150" y="290" font-size="23" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">设备</text><text x="475" y="290" font-size="23" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">供电柜</text><text x="800" y="290" font-size="23" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">配电站</text><text x="100" y="357" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">A.power = 5 kW</text><text x="450" y="357" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">边属性：从 10:00 起有效</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">箭头是“依赖方 → 被依赖方”；故障影响分析要沿入边反向查找。</text></svg>