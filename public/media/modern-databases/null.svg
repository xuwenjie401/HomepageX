<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">LEFT JOIN：过滤放在 ON 还是 WHERE，会改变保留的行</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(a) 条件在 ON：保留无匹配顾客</text><text x="540" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(b) 条件在 WHERE：空值行被过滤</text><rect x="55" y="135" width="128" height="41" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="65" y="163" font-size="19" fill="white" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">顾客</text><rect x="185" y="135" width="278" height="41" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="195" y="163" font-size="19" fill="white" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">未结束租赁</text><rect x="55" y="178" width="128" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="65" y="206" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">7</text><rect x="185" y="178" width="278" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="195" y="206" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">101</text><rect x="55" y="221" width="128" height="41" rx="3" fill="#fff0e7" stroke="none" stroke-width="2"/><text x="65" y="249" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">8</text><rect x="185" y="221" width="278" height="41" rx="3" fill="#fff0e7" stroke="none" stroke-width="2"/><text x="195" y="249" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">NULL</text><rect x="555" y="135" width="128" height="41" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="565" y="163" font-size="19" fill="white" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">顾客</text><rect x="685" y="135" width="278" height="41" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="695" y="163" font-size="19" fill="white" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">未结束租赁</text><rect x="555" y="178" width="128" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="565" y="206" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">7</text><rect x="685" y="178" width="278" height="41" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="695" y="206" font-size="19" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">101</text><text x="65" y="322" font-size="23" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">NULL = open → unknown</text><text x="555" y="322" font-size="23" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">WHERE 只保留 true</text><text x="65" y="385" font-size="22" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">COUNT(*) = 2</text><text x="555" y="385" font-size="22" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">COUNT(租赁编号) = 1</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">NULL 不是普通字符串或零；缺失值会影响筛选、连接与计数。</text></svg>