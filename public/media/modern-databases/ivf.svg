<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">IVF：只搜最近中心的列表，可能漏掉边界邻居</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">三个粗分区与查询点</text><line x1="345" y1="115" x2="345" y2="360" stroke="#788597" stroke-width="2" stroke-dasharray="7 5"/><line x1="645" y1="115" x2="645" y2="360" stroke="#788597" stroke-width="2" stroke-dasharray="7 5"/><rect x="191" y="248" width="18" height="18" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="200" y="400" font-size="23" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">列表 1</text><circle cx="135" cy="197" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="225" cy="322" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="262" cy="230" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="190" cy="157" r="6" fill="#788597" stroke="none" stroke-width="2"/><rect x="481" y="248" width="18" height="18" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="490" y="400" font-size="23" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">列表 2</text><circle cx="425" cy="197" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="515" cy="322" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="552" cy="230" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="480" cy="157" r="6" fill="#788597" stroke="none" stroke-width="2"/><rect x="791" y="248" width="18" height="18" rx="3" fill="#2563a6" stroke="none" stroke-width="2"/><text x="800" y="400" font-size="23" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">列表 3</text><circle cx="735" cy="197" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="825" cy="322" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="862" cy="230" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="790" cy="157" r="6" fill="#788597" stroke="none" stroke-width="2"/><circle cx="338" cy="240" r="8" fill="#c45435" stroke="none" stroke-width="2"/><text x="295" y="218" font-size="24" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">q</text><circle cx="356" cy="240" r="7" fill="#24745e" stroke="none" stroke-width="2"/><text x="374" y="230" font-size="22" fill="#24745e" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">真正近邻</text><text x="555" y="82" font-size="21" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">nprobe = 1：只取左侧列表</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">查询点靠近分区边界；探测第二个列表才能看到跨边界的邻居。</text></svg>