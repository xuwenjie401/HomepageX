<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">全局 top-k 再过滤，不等于过滤集合内的 top-k</text><text x="40" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(a) 全局排名前 5，全都不符合过滤</text><rect x="45" y="125" width="80" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="85.0" y="157" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">1×</text><rect x="128" y="125" width="80" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="168.0" y="157" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">2×</text><rect x="211" y="125" width="80" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="251.0" y="157" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">3×</text><rect x="294" y="125" width="80" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="334.0" y="157" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">4×</text><rect x="377" y="125" width="80" height="48" rx="3" fill="#fff0e7" stroke="#c45435" stroke-width="2"/><text x="417.0" y="157" font-size="21" fill="#c45435" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">5×</text><text x="80" y="254" font-size="28" fill="#c45435" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">过滤后：空集</text><text x="540" y="82" font-size="23" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">(b) 先确定允许的候选集合</text><rect x="555" y="125" width="109" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="609.5" y="157" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">6✓</text><rect x="667" y="125" width="109" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="721.5" y="157" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">7✓</text><rect x="779" y="125" width="109" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="833.5" y="157" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">8✓</text><text x="555" y="254" font-size="25" fill="#24745e" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">集合内重排：6、7、8</text><text x="65" y="365" font-size="24" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">固定过采样倍率不是保证；候选重排也补不回漏掉的对象。</text><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">数字是教学对象编号与排名。所有评估必须使用相同过滤条件的真值集合。</text></svg>