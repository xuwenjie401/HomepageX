<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8" fill="context-stroke"/></marker></defs><text x="30" y="38" font-size="26" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">先集中事实源，再按负载拆出可重建投影</text><rect x="50" y="105" width="570" height="202" rx="3" fill="#edf2f7" stroke="#2563a6" stroke-width="2"/><text x="75" y="145" font-size="25" fill="#2563a6" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">权威库：PostgreSQL + PostGIS</text><rect x="75" y="176" width="122" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="136.0" y="208" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">身份</text><rect x="200" y="176" width="122" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="261.0" y="208" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">几何</text><rect x="325" y="176" width="122" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="386.0" y="208" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">历史</text><rect x="450" y="176" width="122" height="48" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="511.0" y="208" font-size="21" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">边</text><text x="75" y="271" font-size="22" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">同事务：对象版本 + Outbox</text><rect x="725" y="108" width="223" height="102" rx="3" fill="#edf2f7" stroke="#24745e" stroke-width="2"/><text x="837" y="151" font-size="24" fill="#24745e" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">对象存储</text><text x="837" y="185" font-size="20" fill="#24745e" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">图片 + 摘要</text><rect x="50" y="348" width="265" height="70" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="182" y="376" font-size="22" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">向量投影</text><text x="182" y="405" font-size="19" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">HNSW / IVF</text><rect x="375" y="348" width="265" height="70" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="507" y="376" font-size="22" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">图投影</text><text x="507" y="405" font-size="19" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">类型化邻接边</text><rect x="700" y="348" width="265" height="70" rx="3" fill="#edf2f7" stroke="none" stroke-width="2"/><text x="832" y="376" font-size="22" fill="#2563a6" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">查询协调</text><text x="832" y="405" font-size="19" fill="#203047" text-anchor="middle" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">过滤 / 复核 / 排序</text><line x1="180" y1="309" x2="180" y2="344" stroke="#24745e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><line x1="500" y1="309" x2="500" y2="344" stroke="#24745e" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><line x1="620" y1="263" x2="832" y2="263" stroke="#788597" stroke-width="2" stroke-dasharray="7 5"/><line x1="832" y1="263" x2="832" y2="344" stroke="#788597" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/><line x1="30" y1="436" x2="970" y2="436" stroke="#edf2f7" stroke-width="2"/><text x="30" y="474" font-size="21" fill="#203047" text-anchor="start" font-family="Noto Sans CJK SC,sans-serif" xml:space="preserve">虚线为异步传播或查询协调；起步可把向量与关系查询留在同一数据库。</text></svg>